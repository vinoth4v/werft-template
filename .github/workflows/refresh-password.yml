name: Refresh the operator password

# Started by `pnpm werft-password` on a laptop: it sets WERFT_PASSWORD_HASH on
# this repository, then starts this workflow, which pushes that hash to every
# Werft-built app on Coolify and redeploys each one. Runs on the home runner
# because Coolify's API is only reachable inside the home network. The hash is
# never a password; see packages/create-werft-app/src/operator-password.ts.
on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: [self-hosted, werft-home]
    timeout-minutes: 15
    env:
      # Lists the apps (gh api) and reads the registry.
      GH_TOKEN: ${{ secrets.GH_SCAFFOLD_TOKEN }}
      WERFT_REGISTRY_TOKEN: ${{ secrets.WERFT_REGISTRY_TOKEN }}
      WERFT_PASSWORD_HASH: ${{ secrets.WERFT_PASSWORD_HASH }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Push the hash to every app
        run: node --experimental-strip-types packages/create-werft-app/src/password-cli.ts --fleet-only
