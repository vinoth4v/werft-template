name: Reap stale preview branches

# Self-heals what pr-cleanup.yml's event-driven trigger can miss — see
# .github/scripts/reap-stale-preview-branches.mjs for the real bug this
# closes. Every 6 hours is often enough that nothing accumulates for long,
# without being so frequent it's the main way cleanup happens.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

jobs:
  reap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node .github/scripts/reap-stale-preview-branches.mjs
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
