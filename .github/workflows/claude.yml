name: Claude Code

# @claude on an issue or PR comment triggers Claude Code headless in this
# runner. It opens or updates a pull request; it never merges one — that stays
# a human action, always. See AGENTS.md's Phase 3 guardrails.
#
# All model calls route through Kompass (ANTHROPIC_BASE_URL/ANTHROPIC_AUTH_TOKEN
# below), never Anthropic's API directly — same rule as everywhere else in this
# repo. anthropic_api_key is passed only because the action refuses to start
# without something in that input; the real credential is ANTHROPIC_AUTH_TOKEN.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://kompass.vinoth4v.workers.dev
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.KOMPASS_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.KOMPASS_TOKEN }}
