name: PR checks

# Four gates, all blocking. Configure branch protection on `main` to require
# all four status checks (gitleaks, typecheck, build, preview-smoke) before a
# PR can be merged — this workflow produces the checks, but making them
# mandatory is a repository setting this file cannot set for itself.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN has no pull-requests scope. Without it,
    # gitleaks-action's own call to list the PR's commits 403s with
    # "Resource not accessible by integration" before it scans anything.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Exit 0 or the PR stays red. Models and agents do not get to
      # self-report success here — this is the check that decides.
      - run: pnpm -r build

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # A change to behaviour that documents nothing is the failure this
      # catches: the diff survives in git, the reasoning does not, and six
      # months later nobody knows which approaches were already tried.
      #
      # Only source counts as behaviour. A PR touching a workflow, a lockfile or
      # the docs themselves is not asked to explain itself, and neither is a
      # test-only change.
      - name: Require a documented change
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "changed:"; echo "$CHANGED" | sed 's/^/  /'

          SOURCE=$(echo "$CHANGED" | grep -E '^apps/web/src/|^packages/[^/]+/src/' | grep -v '\.test\.' || true)
          if [ -z "$SOURCE" ]; then
            echo "no source changes — nothing to document"
            exit 0
          fi

          # Any docs/*.md counts: an app documents itself in ARCHITECTURE.md and
          # SESSIONS.md, while werft-template keeps its own reasoning in
          # docs/plan.md. The rule is "write down what you did", not "use these
          # exact two filenames in every repo that inherits this workflow".
          if echo "$CHANGED" | grep -qE '^docs/.*\.md$|^README\.md$'; then
            echo "source changed and the docs were updated"
            exit 0
          fi

          echo "::error::Source changed but no documentation did. README.md is the front door (what it is, what works); docs/ARCHITECTURE.md is how it works now; docs/SESSIONS.md is why. Describe the app as it now is in ARCHITECTURE.md, and append what you decided and why to SESSIONS.md. See AGENTS.md."
          exit 1

  neon-preview:
    name: neon-preview-branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node .github/scripts/neon-preview-branch.mjs create
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GIT_BRANCH: ${{ github.head_ref }}

  preview-smoke:
    name: preview-smoke
    runs-on: ubuntu-latest
    needs: neon-preview
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for the preview deployment
        id: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          url=$(node .github/scripts/wait-for-preview.mjs)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - name: Playwright smoke against the preview URL
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
        run: pnpm exec playwright test
