name: Scaffold app

# The marketplace's "create an app" button, made real: its /new form dispatches
# this workflow, which runs the same create-werft-app the terminal does — one
# scaffold implementation, two front doors. Runs here in werft-template
# because this repo owns the scaffold code and the shared credentials; the
# marketplace only needs permission to dispatch, never the credentials
# themselves.
#
# Deliberately NO password input: workflow_dispatch inputs are visible in the
# run's summary to anyone who can read the repo, and this repo is public. The
# app comes up without a sign-in configured; the operator sets it afterwards
# with `pnpm hash-password` — the run's notes say exactly that.
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name — becomes the repo, database, Vercel project and URL"
        required: true
        type: string
      title:
        description: "Display name, e.g. \"My App\" (defaults to the app name)"
        required: false
        type: string
        default: ""
      description:
        description: "One line for the registry card"
        required: true
        type: string
      email:
        description: "Operator email — the only address that can sign in"
        required: true
        type: string
      tags:
        description: "Comma-separated registry tags"
        required: false
        type: string
        default: ""
      visibility:
        description: "Repository visibility"
        required: true
        type: choice
        options: [public, private]
        default: public
      status:
        description: "Registry status"
        required: true
        type: choice
        options: [prototype, active, paused, archived]
        default: prototype
      deploy:
        description: "Deploy to production at the end"
        required: false
        type: boolean
        default: true
      vercel_sso:
        description: "Put Vercel SSO in front of the whole deployment"
        required: false
        type: boolean
        default: false
      region:
        description: "Where it lives — co-locates database, functions and bucket"
        required: false
        type: choice
        options: ["", us-east, eu-central, us-west]
        default: ""
      with_s3:
        description: "Provision a per-app S3 bucket + bucket-scoped IAM user"
        required: false
        type: boolean
        default: false
      theme:
        description: "Design theme"
        required: true
        type: choice
        options: [werft, madras, deck, nordlicht, tinte, kimi-earth, kimi-cocoa, kimi-editorial, kimi-terminal]
        default: werft
      build_plan:
        description: "Build plan — filed as an @claude issue so Claude Code starts building immediately. Paste the whole plan; markdown is fine"
        required: false
        type: string
        default: ""

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # gh CLI reads GH_TOKEN; needs a token that can create repos, which the
      # workflow's own GITHUB_TOKEN cannot (it is scoped to this repo only).
      GH_TOKEN: ${{ secrets.GH_SCAFFOLD_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      # The Vercel CLI and the scaffold's API calls both read this env var.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # The admin AWS key lives here, once, and never in a scaffolded app:
      # --with-s3 uses it to mint each app its own bucket-scoped IAM user.
      # Absent is fine — the scaffold only reads it when --with-s3 is passed.
      # The operator's standing password hash — never a password. Without it
      # every app created here ships with no way to sign in.
      WERFT_PASSWORD_HASH: ${{ secrets.WERFT_PASSWORD_HASH }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # Shared secrets the scaffold copies into the new app's own repo —
      # resolveSharedSecret reads the environment first, so no ~/.config
      # is needed on a runner.
      WERFT_REGISTRY_TOKEN: ${{ secrets.WERFT_REGISTRY_TOKEN }}
      KOMPASS_TOKEN: ${{ secrets.KOMPASS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install the Vercel CLI
        run: npm install -g vercel@58
      - name: Configure git identity and credentials
        run: |
          git config --global user.email "werft-scaffold[bot]@users.noreply.github.com"
          git config --global user.name "werft-scaffold[bot]"
          # gh repo create --push authenticates itself, but the scaffold's
          # later bare `git push` (recording the deploy URL) needs git to ask
          # gh for credentials — on a laptop that helper is already installed,
          # on a runner it is not. Without this line the run dies at the very
          # last push with "could not read Username", after everything else
          # succeeded (proven once; rollback removed all four resources).
          gh auth setup-git
      - name: Run create-werft-app
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_TITLE: ${{ inputs.title }}
          APP_DESCRIPTION: ${{ inputs.description }}
          APP_EMAIL: ${{ inputs.email }}
          APP_TAGS: ${{ inputs.tags }}
          APP_STATUS: ${{ inputs.status }}
          APP_REGION: ${{ inputs.region }}
          APP_THEME: ${{ inputs.theme }}
        run: |
          set -euo pipefail
          # --dir is the runner's throwaway checkout, not the operator's
          # laptop: the app is pushed to GitHub and the directory discarded
          # when the runner ends. The ~/Documents/workspace default only
          # applies to a human running the CLI.
          FLAGS=(--name "$APP_NAME" --description "$APP_DESCRIPTION" --email "$APP_EMAIL" \
                 --status "$APP_STATUS" --theme "$APP_THEME" --dir "$RUNNER_TEMP/$APP_NAME" --yes)
          [ -n "$APP_TITLE" ] && FLAGS+=(--title "$APP_TITLE")
          [ -n "$APP_TAGS" ] && FLAGS+=(--tags "$APP_TAGS")
          [ -n "$APP_REGION" ] && FLAGS+=(--region "$APP_REGION")
          [ "${{ inputs.visibility }}" = "public" ] && FLAGS+=(--public) || FLAGS+=(--private)
          [ "${{ inputs.deploy }}" = "false" ] && FLAGS+=(--no-deploy)
          [ "${{ inputs.vercel_sso }}" = "true" ] && FLAGS+=(--vercel-sso)
          [ "${{ inputs.with_s3 }}" = "true" ] && FLAGS+=(--with-s3)
          node --experimental-strip-types packages/create-werft-app/src/cli.ts "${FLAGS[@]}"
      - name: File the build plan as an @claude issue
        if: ${{ inputs.build_plan != '' }}
        env:
          APP_NAME: ${{ inputs.app_name }}
          BUILD_PLAN: ${{ inputs.build_plan }}
        run: |
          set -euo pipefail
          OWNER=$(gh api user -q .login)
          # Written via a file, not an inline argument: a real build plan is
          # multi-line markdown, and interpolating it into a shell string
          # mangles backticks, quotes and newlines.
          {
            printf '@claude Build this app according to the plan below.\n\n'
            printf '%s\n' "$BUILD_PLAN"
            printf '\n---\n'
            printf 'Filed automatically by the Werft create-app form. Work on a branch and open a pull request; a human merges.\n'
          } > /tmp/plan.md
          gh issue create --repo "$OWNER/$APP_NAME" \
            --title "Build plan" --body-file /tmp/plan.md

      # ---- tell the operator, without inventing a mail service --------------
      # An assigned GitHub issue is the one notification channel already wired
      # to a real inbox: GitHub emails the assignee. No new secret, no new
      # dependency, and it lands in the app's own repo where the work is.
      #
      # It reports what it verified, not that it finished: the URL is polled
      # until it answers, and a login page (302 or 200) is the proof the gate
      # is up rather than a blank deployment.
      - name: Confirm the app is live, and say so
        if: success()
        env:
          APP_NAME: ${{ inputs.app_name }}
          HAD_PLAN: ${{ inputs.build_plan != '' }}
          DEPLOYED: ${{ inputs.deploy }}
        run: |
          set -euo pipefail
          OWNER=$(gh api user -q .login)
          SLUG="$OWNER/$APP_NAME"

          if [ "$DEPLOYED" = "false" ]; then
            echo "not deployed by request — no liveness check to run"
            exit 0
          fi

          # The scaffold records the real URL in werft.json on the new repo.
          URL=$(gh api "repos/$SLUG/contents/werft.json" --jq .content \
                | base64 -d | python3 -c 'import json,sys; print(json.load(sys.stdin).get("url",""))')
          if [ -z "$URL" ]; then
            echo "no URL recorded — skipping the liveness check"
            exit 0
          fi

          STATUS="did not answer"
          for _ in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || echo 000)
            case "$CODE" in
              200|302|307) STATUS="answered HTTP $CODE"; break ;;
            esac
            sleep 15
          done

          {
            printf '## %s is live\n\n' "$APP_NAME"
            printf -- '- **URL:** %s (%s)\n' "$URL" "$STATUS"
            printf -- '- **Sign in:** your standing operator email and password\n'
            printf -- '- **Repo:** https://github.com/%s\n' "$SLUG"
            printf -- '- **On the wall:** https://werft-marketplace.vercel.app/apps/%s\n\n' "$APP_NAME"
            if [ "$HAD_PLAN" = "true" ]; then
              printf 'Claude Code has the build plan and is working on a branch. It opens a pull\n'
              printf 'request; you merge it. Watch the Pull requests tab.\n'
            else
              printf 'No build plan was given, so this is the bare template. Comment `@claude`\n'
              printf 'with what you want built.\n'
            fi
          } > /tmp/live.md

          gh issue create --repo "$SLUG" --title "$APP_NAME is live" \
            --body-file /tmp/live.md --assignee "$OWNER"
