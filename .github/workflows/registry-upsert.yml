name: Registry upsert

# On merge to main, post this app's own werft.json to the Werft registry.
# Populated by CI only — see AGENTS.md. Skips gracefully rather than failing
# the build when WERFT_REGISTRY_TOKEN isn't configured, since not every clone
# of this template will have registry access wired up yet.
on:
  push:
    branches: [main]

jobs:
  upsert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Upsert into the Werft registry
        env:
          WERFT_REGISTRY_TOKEN: ${{ secrets.WERFT_REGISTRY_TOKEN }}
        run: |
          if [ -z "$WERFT_REGISTRY_TOKEN" ]; then
            echo "WERFT_REGISTRY_TOKEN not set — skipping registry upsert"
            exit 0
          fi
          if [ ! -f werft.json ]; then
            echo "no werft.json in this repo — skipping registry upsert"
            exit 0
          fi

          # werft.json plus a summary of graphify-out/graph.json when the repo
          # has one. The script falls back to werft.json alone if the graph is
          # missing or unreadable, so a failed graph build never blocks the
          # upsert. Apps scaffolded before the script existed post werft.json
          # directly, exactly as they did before.
          payload=werft.json
          if [ -f scripts/registry-payload.mjs ]; then
            if node scripts/registry-payload.mjs > /tmp/registry-payload.json; then
              payload=/tmp/registry-payload.json
            else
              echo "payload build failed — posting werft.json unchanged"
            fi
          fi

          status=$(curl -sS -o /tmp/registry-response.json -w '%{http_code}' \
            -X POST https://werft-marketplace.vercel.app/api/registry/upsert \
            -H "Authorization: Bearer $WERFT_REGISTRY_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$payload")

          cat /tmp/registry-response.json
          if [ "$status" -ge 300 ]; then
            echo "registry upsert failed with HTTP $status"
            exit 1
          fi
